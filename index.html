<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktikum 1 - Scene Pertama</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-box position="0 0.5 -3" rotation="0 45 0" color="#FF7043"></a-box>

    <a-sphere position="-2 1.25 -4" radius="1.25" color="#FFEE58"></a-sphere>

    <a-cylinder position="1.5 0.75 -3" radius="0.5" height="1.5"
               color="#26C6DA"></a-cylinder>

    <a-cone position="3.5 0.8 -4.5" radius-bottom="0.8" radius-top="0" height="1.6"
            color="#AB47BC"></a-cone>

    <a-torus position="0 2.2 -3" radius="0.7" radius-tubular="0.15"
             color="#66BB6A"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"></a-torus>
             
    <a-text value="Muhammad Dzaky Aulia&#10;NPM 2309020319"
            position="0 5 -5" align="center" width="8"
            color="#FFFFFF"></a-text>
            
    <a-plane position="0 0 -4" rotation="-90 0 0" width="12" height="12"
             color="#E8C07D"></a-plane>
             
    <a-sky color="#1B2A49"></a-sky>
  </a-scene>
</body>
</html>
